name: Windows Release

env:
  PACKAGE_VERSION: "0.4.4"

on:
  push:
    branches: [main, "feature/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure, build, and test
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $install) { throw "No Visual Studio C++ toolset found" }
          Write-Host "MSVC at $install"
          $vcvars = Join-Path $install "VC\Auxiliary\Build\vcvars64.bat"
          $ninjaDir = Split-Path (Get-Command ninja -ErrorAction Stop).Source
          # Inherit Ninja, then let vcvars prepend cl. Do not assign PATH inside cmd:
          # %PATH% expands before vcvars runs and drops the MSVC tools, so CMake
          # would pick MinGW instead.
          $env:PATH = "$ninjaDir;$env:PATH"
          cmd /c "`"$vcvars`" && cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl && cmake --build build --parallel && ctest --test-dir build --output-on-failure"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        shell: pwsh
        run: |
          $root = "package/MORTRAUMA"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $exe = Get-ChildItem -Path build -Recurse -Filter MORTRAUMA.exe | Select-Object -First 1
          if (-not $exe) { throw "MORTRAUMA.exe was not produced" }
          Copy-Item $exe.FullName (Join-Path $root "MORTRAUMA.exe")
          Get-ChildItem $exe.DirectoryName -Filter *.dll -ErrorAction SilentlyContinue | Copy-Item -Destination $root
          Copy-Item -Recurse assets (Join-Path $root "assets")
          New-Item -ItemType Directory -Force -Path (Join-Path $root "configurations") | Out-Null
          Copy-Item assets/configurations/*.json (Join-Path $root "configurations")
          Copy-Item -Recurse assets/configurations/presets (Join-Path $root "configurations/presets")
          @"
          MORTRAUMA v$env:PACKAGE_VERSION
          Physical Reactions Laboratory

          Run MORTRAUMA.exe from this folder. Assets are loaded relative to the executable.

          The MSVC runtime is linked statically. A Visual Studio install is not required.
          An OpenGL 3.3 driver is required. The build enables AVX2 through Jolt Physics.

          v0.4.4 is Humanoidguy only. A rejected single-leg pose is not placed.
          Standing still uses the torque-limited balance controller. The Stepping
          Laboratory can shift weight and try to unload the other foot. A lift
          starts only after the sole actually rises while the stance holds.
          Nothing pins the feet. A hard push can still knock the character down.
          "@ | Set-Content -Encoding utf8 (Join-Path $root "README.txt")
          $zip = "MORTRAUMA-v$env:PACKAGE_VERSION-Windows-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path $root -DestinationPath $zip

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: MORTRAUMA-v${{ env.PACKAGE_VERSION }}-Windows-x64
          path: MORTRAUMA-v${{ env.PACKAGE_VERSION }}-Windows-x64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: MORTRAUMA-v${{ env.PACKAGE_VERSION }}-Windows-x64
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          asset="dist/MORTRAUMA-v${PACKAGE_VERSION}-Windows-x64.zip"
          notes="docs/RELEASE_NOTES_v${PACKAGE_VERSION}.md"
          test -f "$asset"
          test -f "$notes"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists. Refusing to overwrite it."
            exit 1
          fi
          if [ "$tag" = "v0.1.0" ] || [ "$tag" = "v0.1.1" ] || [ "$tag" = "v0.2.0" ] || [ "$tag" = "v0.3.0" ] || [ "$tag" = "v0.3.1" ] || [ "$tag" = "v0.3.2" ] || [ "$tag" = "v0.3.3" ] || [ "$tag" = "v0.3.4" ] || [ "$tag" = "v0.4.0" ] || [ "$tag" = "v0.4.1" ] || [ "$tag" = "v0.4.2" ] || [ "$tag" = "v0.4.3" ]; then
            echo "Refusing to publish over an existing release."
            exit 1
          fi
          gh release create "$tag" "$asset" \
            --title "MORTRAUMA $tag" \
            --notes-file "$notes"
          gh release view "$tag" --json tagName,assets --jq '.assets[].name'
